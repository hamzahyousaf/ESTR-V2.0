<body>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const { motion, AnimatePresence } = window.FramerMotion || { motion: ({children, ...props}) => React.createElement('div', props, children), AnimatePresence: ({children}) => children };
        
        // Icons Mock/Fix (Lucide might not be directly available as window.Lucide)
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- SERVICES (Inlined) ---

        // Indicators
        const calculateEMA = (data, period) => {
            const k = 2 / (period + 1);
            let ema = [data[0]];
            for (let i = 1; i < data.length; i++) {
                ema.push(data[i] * k + ema[i - 1] * (1 - k));
            }
            return ema;
        };

        const calculateRSI = (data, period = 14) => {
            let rsi = new Array(data.length).fill(50);
            if (data.length <= period) return rsi;
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                const diff = data[i] - data[i - 1];
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            let avgGain = gains / period, avgLoss = losses / period;
            for (let i = period + 1; i < data.length; i++) {
                const diff = data[i] - data[i - 1];
                const gain = diff >= 0 ? diff : 0;
                const loss = diff < 0 ? -diff : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
                const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                rsi[i] = 100 - 100 / (1 + rs);
            }
            return rsi;
        };

        const detectCandlestickPatterns = (klines) => {
            const last = klines[klines.length - 1], prev = klines[klines.length - 2];
            const bodySize = Math.abs(last.close - last.open), upperShadow = last.high - Math.max(last.open, last.close), lowerShadow = Math.min(last.open, last.close) - last.low;
            const patterns = [];
            if (lowerShadow > bodySize * 2 && upperShadow < bodySize * 0.5) patterns.push('Hammer');
            if (upperShadow > bodySize * 2 && lowerShadow < bodySize * 0.5) patterns.push('Shooting Star');
            if (last.close > last.open && prev.open > prev.close && last.close > prev.open && last.open < prev.close) patterns.push('Bullish Engulfing');
            if (last.open > last.close && prev.close > prev.open && last.open > prev.close && last.close < prev.open) patterns.push('Bearish Engulfing');
            return patterns;
        };

        // SMC Logic
        const detectSMC = (klines) => {
            const result = [];
            if (klines.length < 20) return result;
            const len = klines.length, lastCandle = klines[len-1], prevCandle = klines[len-2];
            if (klines[len - 1].low > klines[len - 3].high) result.push({ type: 'FVG', direction: 'BULLISH', price: (klines[len - 1].low + klines[len - 3].high) / 2, strength: 1.5 });
            if (klines[len - 1].high < klines[len - 3].low) result.push({ type: 'FVG', direction: 'BEARISH', price: (klines[len - 1].high + klines[len - 3].low) / 2, strength: 1.5 });
            if (lastCandle.close > lastCandle.open && prevCandle.open > prevCandle.close && lastCandle.close > prevCandle.high) result.push({ type: 'OB', direction: 'BULLISH', price: prevCandle.low, strength: 2.5 });
            if (lastCandle.open > lastCandle.close && prevCandle.close > prevCandle.open && lastCandle.close < prevCandle.low) result.push({ type: 'OB', direction: 'BEARISH', price: prevCandle.high, strength: 2.5 });
            const highs = klines.map(k => k.high), lows = klines.map(k => k.low);
            const recentHigh = Math.max(...highs.slice(-10, -1)), recentLow = Math.min(...lows.slice(-10, -1));
            if (lastCandle.close > recentHigh) result.push({ type: 'BOS', direction: 'BULLISH', price: recentHigh, strength: 2.0 });
            else if (lastCandle.close < recentLow) result.push({ type: 'BOS', direction: 'BEARISH', price: recentLow, strength: 2.0 });
            return result;
        };

        // Scoring
        const STRATEGY_METADATA = {
            'EMA-20 Trend': { weight: 1.0, description: 'EMA 20 trend confirmation.' },
            'RSI Oversold': { weight: 1.5, description: 'RSI < 30.' },
            'RSI Overbought': { weight: 1.5, description: 'RSI > 70.' },
            'Hammer': { weight: 2.0, description: 'Bullish Hammer.' },
            'Shooting Star': { weight: 2.0, description: 'Bearish Shooting Star.' },
            'Bullish Engulfing': { weight: 2.5, description: 'Bullish Engulfing.' },
            'Bearish Engulfing': { weight: 2.5, description: 'Bearish Engulfing.' },
            'BOS (BULLISH)': { weight: 2.0, description: 'Bullish BOS.' },
            'BOS (BEARISH)': { weight: 2.0, description: 'Bearish BOS.' },
            'FVG (BULLISH)': { weight: 1.5, description: 'Bullish FVG.' },
            'FVG (BEARISH)': { weight: 1.5, description: 'Bearish FVG.' },
            'OB (BULLISH)': { weight: 2.5, description: 'Bullish OB.' },
            'OB (BEARISH)': { weight: 2.5, description: 'Bearish OB.' }
        };

        const calculateWeightedScore = (mode, techStrategies, smcEntities, currentPrice, dynamicWeights = {}) => {
            let bullishPoints = 0, bearishPoints = 0, strategies = [], strategiesDetails = [];
            techStrategies.forEach(s => {
                const meta = STRATEGY_METADATA[s] || { weight: 1.0, description: 'Tech signal.' };
                const weight = dynamicWeights[s] || meta.weight;
                if (s.includes('Bullish') || s === 'Hammer' || s.includes('Trend') || s === 'RSI Oversold') bullishPoints += weight; else bearishPoints += weight;
                strategies.push(s); strategiesDetails.push({ name: s, weight, description: meta.description });
            });
            smcEntities.forEach(e => {
                const name = `${e.type} (${e.direction})`;
                const meta = STRATEGY_METADATA[name] || { weight: e.strength, description: `SMC ${e.type}.` };
                const weight = dynamicWeights[name] || meta.weight;
                if (e.direction === 'BULLISH') bullishPoints += weight; else bearishPoints += weight;
                strategies.push(name); strategiesDetails.push({ name, weight, description: meta.description });
            });
            const direction = bullishPoints >= bearishPoints ? 'LONG' : 'SHORT';
            const score = direction === 'LONG' ? bullishPoints : bearishPoints;
            const total = bullishPoints + bearishPoints;
            const confidence = total === 0 ? 0 : Math.min(100, Math.round((score / total) * 100));
            return { score, confidence, direction, strategies, strategiesDetails, reason: `Confluence detected via ${strategies.slice(0,2).join(' & ')}.` };
        };

        const getSignalGrade = (score, confidence) => score >= 6 && confidence >= 80 ? 'A+' : score >= 4 && confidence >= 65 ? 'A' : 'B';

        // --- COMPONENTS ---

        const Login = () => {
             const handleLogin = async () => {
                const { auth, googleProvider, signInWithPopup } = window.firebaseUtils;
                try {
                    await signInWithPopup(auth, googleProvider);
                } catch (error) {

                    } else {
                        alert("Login Error: " + error.message);
                    }
                }
            };
            return (
                <div className="h-screen w-screen flex items-center justify-center bg-bento-bg p-4">
                    <div className="bg-bento-card border border-bento-border p-8 rounded-2xl max-w-md w-full text-center space-y-6 shadow-2xl">
                        <div className="flex justify-center">
                            <div className="p-4 bg-bento-gold/10 rounded-full">
                                <Icon name="shield-alert" className="w-12 h-12 text-bento-gold" />
                            </div>
                        </div>
                        <h1 className="text-2xl font-black tracking-tight text-white mb-2">ESTR V2.0 PRO</h1>
                        <p className="text-bento-muted text-sm px-4">Advanced Crypto AI Scanner. SMC/ICT Momentum Convergence Matrix.</p>
                        <button onClick={handleLogin} className="w-full flex items-center justify-center gap-3 bg-white text-black py-4 rounded-xl font-black hover:bg-slate-200 transition-all uppercase tracking-widest shadow-xl">
                            <Icon name="log-in" className="w-5 h-5" /> Login with Google
                        </button>
                        <div className="pt-4 border-t border-bento-border">
                            <p className="text-[10px] text-bento-muted font-bold uppercase tracking-widest leading-loose">
                                Deployed on Netlify? <br/> 
                                <span className="text-bento-gold">Add site to Firebase Authorized Domains</span>
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [results, setResults] = useState([]);
            const [isScanning, setIsScanning] = useState(false);
            const [activeTab, setActiveTab] = useState('SCANNER');

            useEffect(() => {
                const { auth, db, onAuthStateChanged } = window.firebaseUtils;
                return onAuthStateChanged(auth, u => {
                    setUser(u ? { uid: u.uid, email: u.email, displayName: u.displayName, isAdmin: u.email === 'hamzahyousaf@gmail.com' } : null);
                    setLoading(false);
                });
            }, []);

            const runScanner = async () => {
                setIsScanning(true);
                try {
                    // Simple mock scan because building full cross-origin fetch for Binance in single file might need a proxy or direct API
                    // In a real single-file app, you'd call the Binance API directly if allowed
                    const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                    const data = await response.json();
                    const top = data.filter(i => i.symbol.endsWith('USDT')).sort((a,b) => b.quoteVolume - a.quoteVolume).slice(0, 10);
                    
                    const simulated = top.map(t => ({
                        symbol: t.symbol,
                        direction: Math.random() > 0.5 ? 'LONG' : 'SHORT',
                        score: (Math.random() * 5 + 3),
                        confidence: Math.round(Math.random() * 40 + 50),
                        entry: parseFloat(t.lastPrice),
                        grade: 'A',
                        timestamp: Date.now()

                    setResults(simulated);
                } catch (e) { console.error(e); }
                setIsScanning(false);
            };

            if (loading) return <div className="h-screen w-screen bg-bento-bg flex items-center justify-center text-white font-bold uppercase tracking-widest">Initialising Systems...</div>;
            if (!user) return <Login />;

            return (
                <div className="bento-layout scale-[0.98] origin-center">
                    <aside className="bg-bento-card border border-bento-border rounded-xl p-5 flex flex-col justify-between sidebar">
                        <div className="space-y-8">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-8 h-8 bg-bento-gold rounded-lg flex items-center justify-center">
                                    <Icon name="cpu" className="w-5 h-5 text-black" />
                                </div>
                                <span className="font-black text-lg tracking-tighter italic">ESTR <span className="text-bento-gold">V2.0</span></span>
                            </div>
                            <nav className="space-y-2">
                                <button onClick={() => setActiveTab('SCANNER')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${activeTab === 'SCANNER' ? 'bg-bento-gold text-black shadow-lg shadow-bento-gold/10' : 'text-bento-muted hover:text-white'}`}>
                                    <Icon name="terminal" className="w-4 h-4" /> Scanner
                                </button>
                                <button className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-bento-muted opacity-40 cursor-not-allowed">
                                    <Icon name="brain" className="w-4 h-4" /> AI Hub
                                </button>
                            </nav>
                        </div>
                        <button onClick={runScanner} disabled={isScanning} className="w-full bg-bento-blue hover:bg-blue-600 text-white font-black py-4 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-95 shadow-xl shadow-bento-blue/10">
                            {isScanning ? <Icon name="zap" className="w-4 h-4 animate-pulse" /> : <Icon name="play" className="w-4 h-4" />}
                            {isScanning ? 'RUNNING SCAN...' : 'INITIATE SCAN'}
                        </button>
                    </aside>

                    <header className="bg-bento-card border border-bento-border rounded-xl px-6 flex items-center justify-between header">
                        <div className="flex flex-col">
                            <span className="text-[10px] text-bento-muted font-black tracking-widest uppercase mb-0.5">NETWORKS_AUTHORIZED</span>
                            <span className="text-xs font-black flex items-center gap-2">GOOGLE_OAUTH <span className="w-1.5 h-1.5 rounded-full bg-bento-green"></span></span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right">
                                <span className="text-[10px] text-bento-muted font-bold block leading-none">TERMINAL_ID</span>
                                <span className="text-xs font-mono text-bento-gold">{user.displayName?.toUpperCase()}</span>
                            </div>
                            <div className="w-10 h-10 rounded-full border border-bento-border overflow-hidden">
                                <img src={`https://ui-avatars.com/api/?name=${user.displayName}&background=0D8ABC&color=fff`} />
                            </div>
                        </div>
                    </header>

                    <section className="bg-bento-card border border-bento-border rounded-xl p-4 col-start-2 col-span-2 main-table overflow-hidden flex flex-col">
                        <div className="flex items-center justify-between mb-4 border-b border-bento-border pb-3 px-1">
                            <label className="text-[10px] text-bento-muted font-black uppercase tracking-widest">Real-time convergent stream</label>
                            <span className="text-[10px] font-mono text-bento-gold">{results.length} Nodes Found</span>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            <table className="w-full text-left">
                                <thead className="sticky top-0 bg-bento-card z-10 border-b border-bento-border">
                                    <tr className="text-[9px] text-bento-muted font-black uppercase tracking-widest">
                                        <th className="pb-3 px-2">Symbol</th>
                                        <th className="pb-3 px-2">Score</th>
                                        <th className="pb-3 px-2">Bias</th>
                                        <th className="pb-3 px-2">Price</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-bento-border/30">
                                    {results.map((r, i) => (
                                        <tr key={i} className="group hover:bg-white/5 transition-colors cursor-pointer">
                                            <td className="py-4 px-2 font-black text-sm">{r.symbol}</td>
                                            <td className="py-4 px-2">
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-black ${r.score > 6 ? 'bg-bento-gold/20 text-bento-gold' : 'bg-slate-800 text-slate-400'}`}>
                                                    {r.score.toFixed(1)}
                                                </span>
                                            </td>
                                            <td className="py-4 px-2">
                                                <span className={`text-[10px] font-black ${r.direction === 'LONG' ? 'text-bento-green' : 'text-bento-red'}`}>
                                                    {r.direction}
                                                </span>
                                            </td>
                                            <td className="py-4 px-2 font-mono text-[11px] font-bold text-slate-300">{r.entry.toFixed(4)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <section className="bg-bento-card border border-bento-border rounded-xl p-6 signal-breakdown flex flex-col space-y-6">
                        <div className="space-y-1">
                            <label className="text-[10px] text-bento-muted font-black uppercase tracking-[0.2em] block">System_Node_Analytics</label>
                            <h2 className="text-3xl font-black tracking-tighter">AI AGENT</h2>
                        </div>
                        <div className="flex-1 flex items-center justify-center text-center opacity-30 select-none">
                            <div className="space-y-4">
                                <Icon name="cpu" className="w-16 h-16 mx-auto text-bento-gold" />
                                <p className="text-[10px] font-black uppercase tracking-widest leading-relaxed">
                                    Neural Network <br/> Awaiting Connection
                                </p>
                            </div>
                        </div>
                        <button onClick={() => window.firebaseUtils.signOut(window.firebaseUtils.auth)} className="w-full border border-bento-border py-3 rounded-xl text-xs font-black text-bento-red hover:bg-bento-red/10 transition-all uppercase tracking-widest">
                            Terminate Connection
                        </button>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Lucide init -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
